# Lives in the inventory_backend repo, in whatsapp-service/, and is deployed SEPARATELY from the
# Inventory backend: create a Render Blueprint from this repo with Blueprint path
# `whatsapp-service/render.yaml`. The Inventory backend's own Render service should ignore
# `whatsapp-service/**` (its Build Filters > Ignored paths), so a WhatsApp change never redeploys it.
# Render Blueprint for the ScaleEzy WhatsApp Service: two services, engine + service. Deployed
# 18 Sep 2026. Cut on 5 Oct 2026 to save cost: Redis removed (engine caches in memory), engine on
# Starter, and the database moved off Render's Postgres into Inventory's Supabase, in two schemas
# of its own (`whatsapp` for the service, `evolution_api` for the engine) under a login,
# whatsapp_svc, that cannot see Inventory's tables.
#
# REGION: both services must be in the SAME region and workspace as the Inventory backend, so
# they share Render's private network (Singapore, like the Supabase project).
#
# On a fresh setup: create the whatsapp_svc login and the two schemas in Supabase, set the
# `sync: false` values below in the dashboard (both database URLs, webhook URL, ENCRYPTION_KEY),
# then link the ScaleEzy number (docs/HOW-IT-WORKS.md, "ScaleEzy's own number").

envVarGroups:
  - name: whatsapp-shared
    envVars:
      # The engine's API key. The engine reads AUTHENTICATION_API_KEY; the service accepts the
      # same name, so one value serves both.
      - key: AUTHENTICATION_API_KEY
        generateValue: true
      # The secret in the webhook path the engine calls on the service.
      - key: ENGINE_WEBHOOK_SECRET
        generateValue: true

services:
  # The WhatsApp engine: Evolution API 2.3.7 + the QR-linking patch (engine/Dockerfile).
  # Private: nothing on the internet can reach it, only our services on the private network.
  - type: pserv
    name: whatsapp-engine
    runtime: docker
    region: singapore # must equal the Inventory backend's region (to confirm)
    # Starter (512 MB): measured ~190 MB all day on Standard (2 GB), 5 Oct 2026. Revisit if many
    # shops link their own numbers -- each live link adds memory.
    plan: starter
    dockerContext: ./whatsapp-service/engine
    dockerfilePath: ./whatsapp-service/engine/Dockerfile
    # Only its own folder redeploys it: an Inventory push never rebuilds WhatsApp.
    buildFilter:
      paths:
        - whatsapp-service/engine/**
    # No disk: WhatsApp sessions are stored in Postgres, so links survive restarts and deploys.
    envVars:
      - fromGroup: whatsapp-shared
      - key: SERVER_TYPE
        value: http
      - key: SERVER_PORT
        value: "8080"
      - key: SERVER_URL
        value: http://whatsapp-engine:8080
      - key: AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES
        value: "false"
      - key: CORS_ORIGIN
        value: "*"
      - key: DEL_INSTANCE
        value: "false"
      - key: DATABASE_PROVIDER
        value: postgresql
      # Inventory's Supabase, schema `evolution_api`, as the whatsapp_svc login, session pooler:
      # ...pooler.supabase.com:5432/postgres?schema=evolution_api&connection_limit=3
      - key: DATABASE_CONNECTION_URI
        sync: false
      - key: DATABASE_CONNECTION_CLIENT_NAME
        value: scaleezy_render
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      # No copies of people's chats: only what linking needs. Ticks are recorded by our service.
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "false"
      - key: DATABASE_SAVE_MESSAGE_UPDATE
        value: "false"
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "false"
      - key: DATABASE_SAVE_DATA_CHATS
        value: "false"
      - key: DATABASE_SAVE_DATA_LABELS
        value: "false"
      - key: DATABASE_SAVE_DATA_HISTORIC
        value: "false"
      # No Redis: one engine instance, so its own memory cache does the same job. Links are kept
      # in Postgres (DATABASE_SAVE_DATA_INSTANCE), never in the cache, so a restart loses nothing.
      # Redis only earns its cost with two or more engine instances sharing one cache.
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "true"
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: ScaleEzy
      - key: CONFIG_SESSION_PHONE_NAME
        value: Chrome
      - key: QRCODE_LIMIT
        value: "30"
      - key: LOG_LEVEL
        value: ERROR,WARN,INFO
      - key: LOG_BAILEYS
        value: error
      - key: LANGUAGE
        value: en
      # Events to our service over the private network:
      #   http://<whatsapp-service internal host>:10000/engine/events/<ENGINE_WEBHOOK_SECRET>
      #   with the secret URL-encoded (encodeURIComponent): it can contain / + =
      - key: WEBHOOK_GLOBAL_ENABLED
        value: "true"
      - key: WEBHOOK_GLOBAL_URL
        sync: false
      - key: WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS
        value: "false"
      - key: WEBHOOK_EVENTS_CONNECTION_UPDATE
        value: "true"
      - key: WEBHOOK_EVENTS_QRCODE_UPDATED
        value: "true"
      - key: WEBHOOK_EVENTS_MESSAGES_UPDATE
        value: "true"
      - key: WEBHOOK_EVENTS_SEND_MESSAGE
        value: "true"
      - key: WEBHOOK_EVENTS_MESSAGES_UPSERT
        value: "true"
      - key: WEBHOOK_RETRY_MAX_ATTEMPTS
        value: "3"
      - key: WEBHOOK_RETRY_INITIAL_DELAY_SECONDS
        value: "2"
      - key: WEBHOOK_REQUEST_TIMEOUT_MS
        value: "10000"

  # Our ScaleEzy WhatsApp Service (service/Dockerfile). Public HTTPS, every call needs a key.
  - type: web
    name: whatsapp-service
    runtime: docker
    region: singapore # must equal the Inventory backend's region (to confirm)
    plan: starter
    dockerContext: ./whatsapp-service/service
    dockerfilePath: ./whatsapp-service/service/Dockerfile
    # Only its own folder redeploys it: an Inventory push never rebuilds WhatsApp.
    buildFilter:
      paths:
        - whatsapp-service/service/**
    healthCheckPath: /ready
    # SIGTERM -> the send in progress finishes before the old instance stops.
    maxShutdownDelaySeconds: 60
    numInstances: 1
    envVars:
      - fromGroup: whatsapp-shared
      - key: NODE_ENV
        value: production
      # Inventory's Supabase, schema `whatsapp`, as the whatsapp_svc login (it can reach only the
      # `whatsapp` and `evolution_api` schemas, never Inventory's tables). Session pooler, :5432:
      # postgresql://whatsapp_svc.<project>:<password>@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?schema=whatsapp&connection_limit=3
      # Set in the dashboard; moved off Render's own Postgres on 5 Oct 2026 to cut cost.
      - key: DATABASE_URL
        sync: false
      - key: ENGINE_URL
        fromService:
          type: pserv
          name: whatsapp-engine
          property: hostport
      - key: ADMIN_KEY
        generateValue: true
      # 32 random bytes, base64 (README). Never change it once modules exist.
      - key: ENCRYPTION_KEY
        sync: false
      - key: SCALEEZY_INSTANCE
        value: scaleezy
      - key: SCALEEZY_DAILY_CAP
        value: "150"
      - key: MESSAGE_RETENTION_DAYS
        value: "30" # finished messages are deleted after this; STOPs are kept for good
      - key: CANARY_ENABLED
        value: "true" # on since the ScaleEzy number was linked on Render (set in the dashboard after 18 Sep)
      - key: CANARY_HOUR_IST
        value: "9"
      # Folders pictures may be sent from, comma-separated, each ending in /. Set in the dashboard to
      # the Inventory Supabase project's public inventory-images/whatsapp-media folder:
      # https://<project>.supabase.co/storage/v1/object/public/inventory-images/whatsapp-media/
      # Empty: pictures are refused and GET /v1/capabilities says image: false.
      - key: MEDIA_URL_PREFIXES
        sync: false
      - key: LOG_LEVEL
        value: info
